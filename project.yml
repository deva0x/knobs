# XcodeGen spec for the Knobs app (DEC-007). Knobs.xcodeproj is generated from this file and not committed.
name: Knobs
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  KnobsCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    DEVELOPMENT_TEAM: P564YR8496
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  Knobs:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Manifests
        type: folder
        buildPhase: resources
    dependencies:
      - package: KnobsCore
        product: KnobsCore
      - package: KnobsCore
        product: KnobsSession
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Knobs
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Open source under the MIT License."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item, public.folder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.deva0x.Knobs
        PRODUCT_NAME: Knobs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
